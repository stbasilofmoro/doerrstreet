<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#3d4030"/>
  <!-- Gold border inset -->
  <rect x="3" y="3" width="58" height="58" rx="6" fill="none" stroke="#c9a46a" stroke-width="1.5"/>
  <!-- Left rail -->
  <line x1="21" y1="13" x2="21" y2="51" stroke="#c9a46a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right rail -->
  <line x1="43" y1="13" x2="43" y2="51" stroke="#c9a46a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Cross ties -->
  <line x1="13" y1="21" x2="51" y2="21" stroke="#f0d9a8" stroke-width="3" stroke-linecap="round"/>
  <line x1="13" y1="32" x2="51" y2="32" stroke="#f0d9a8" stroke-width="3" stroke-linecap="round"/>
  <line x1="13" y1="43" x2="51" y2="43" stroke="#f0d9a8" stroke-width="3" stroke-linecap="round"/>
</svg>
