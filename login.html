<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18196674077"></script>

  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | Doerr Street Rail Co</title>
  <meta name="description" content="Customer portal login for Doerr Street Rail Co — access your inspection reports and project status.">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="site-root">

  <div class="login-page">
    <div class="houndstooth-strip houndstooth-pattern" style="height:43px" aria-hidden="true"></div>

    <div class="login-content">
      <img src="/logo.png" alt="Doerr Street Rail Co" height="72" style="display:block;margin-bottom:16px">
      <h1 class="login-title">Customer Login</h1>
      <p class="login-subtitle">Access your inspection reports and project status</p>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label for="lp-email">Email Address</label>
          <input id="lp-email" type="email" name="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="lp-password">Password</label>
          <input id="lp-password" type="password" name="password" placeholder="Password" required autocomplete="current-password">
        </div>

        <div id="login-error" class="login-error" style="display:none">
          The customer portal is coming soon. To access your reports, please call
          <a href="tel:+17043210802">(704) 321-0802</a>.
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <p class="login-help">
        Don't have an account?
        <a href="/contact.html" class="inline-link">Contact us</a>
        to set up access.
      </p>

      <a href="/index.html" class="login-back-btn">&larr; Back to Main Site</a>
    </div>

    <div class="houndstooth-strip houndstooth-pattern" style="height:43px" aria-hidden="true"></div>

    <footer class="site-footer">
      <div class="footer-bottom">
        <span>&copy; <span id="footer-year">2025</span> Doerr Street Rail Co. All rights reserved.</span>
      </div>
    </footer>
  </div>

</div>
<script src="/site.js"></script>
</body>
</html>
